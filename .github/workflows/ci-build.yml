name: CI Build

on:
  push:
    branches: [ master, main, dev ]
    tags: [ 'v*' ]
  workflow_dispatch:
  # 注意：本流水线只出包，不跑测试；测试见 ci-test.yml

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

# 需要写权限：构建成功后把最新 release APK 推到 release 分支
permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dfile.encoding=UTF-8'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 缓存与 ci-test.yml 使用完全相同的 key，两条流水线互通
      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      # 先装 JDK 17：runner 自带的 cmdline-tools/sdkmanager 要求 JDK 17+
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # 关键：不把 runner 预装的几十个新版 SDK 包暴露给 AGP 3.4.1，
          # 否则它用自带的旧 com.android.repository 解析新元数据会喷上万行
          # "cvc-complex-type.2.4.a ... base-extension" + XML 栈，纯噪声且拖慢构建。
          MINI_SDK="$HOME/android-sdk-mini"
          rm -rf "$MINI_SDK"; mkdir -p "$MINI_SDK"
          "$SDKMANAGER" --sdk_root="$MINI_SDK" --install \
            "platforms;android-29" "build-tools;28.0.3" "platform-tools" > /dev/null
          # 许可协议必须落在新 sdk_root 下，否则 AGP 会报 license not accepted
          cp -a "$ANDROID_SDK_ROOT/licenses" "$MINI_SDK/licenses" 2>/dev/null || true
          cp -a "$ANDROID_SDK_ROOT/tools" "$MINI_SDK/tools" 2>/dev/null || true
          {
            echo "ANDROID_SDK_ROOT=$MINI_SDK"
            echo "ANDROID_HOME=$MINI_SDK"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$MINI_SDK" > local.properties
          ls "$MINI_SDK"

      - name: Prepare optional release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_ALIAS: ${{ secrets.STORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            {
              echo "STORE_FILE_NAME=$GITHUB_WORKSPACE/release.jks"
              echo "STORE_ALIAS=$STORE_ALIAS"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "release keystore ready"
          else
            echo "no release keystore secret, fallback to debug signing"
          fi

      # 再切回 JDK 8：Gradle 5.4.1 + AGP 3.4.1 只能跑在 JDK 8
      - name: Set up JDK 8 (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug + release (tests excluded)
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease \
            --no-daemon --stacktrace \
            -x test -x testDebugUnitTest -x testReleaseUnitTest -x lint \
            -PBUILD_NUMBER=$((32 + GITHUB_RUN_NUMBER)) \
            -PVERSION_NAME=2.3.${GITHUB_RUN_NUMBER}

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -print -exec cp {} out/ \;
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt out/mapping-release.txt
          fi
          ls -lh out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yespdf-apk-r${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      # 把最新 release APK 放进仓库的 release 目录：
      # 用独立的 release 分支承载（每次孤儿提交 + force push），
      # 保证 master 历史干净、仓库里只保留"最新一份"产物。
      - name: Publish latest release APK to release/ directory
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK_PATH="$(ls out/*release*.apk | head -1 || true)"
          if [ -z "${APK_PATH}" ]; then
            echo "no release apk produced, skip"
            exit 0
          fi
          APK_NAME="YESPDF-plus-2.3.${{ github.run_number }}-${GITHUB_SHA::7}-release.apk"
          WORK="$(mktemp -d)"
          cd "$WORK"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 孤儿分支：release 分支永远只有一个提交，不累积历史
          git checkout -q --orphan release
          cp "${GITHUB_WORKSPACE}/${APK_PATH}" "./${APK_NAME}"
          {
            echo "# 最新构建产物"
            echo
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 文件 | \`${APK_NAME}\` |"
            echo "| 版本 | 2.3.${{ github.run_number }} |"
            echo "| 提交 | \`${GITHUB_SHA::7}\` |"
            echo "| 来源分支 | ${{ github.ref_name }} |"
            echo "| 构建时间 (UTC) | $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
            echo "| 构建记录 | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo
            echo "> 本目录由 CI 自动维护，每次构建覆盖为最新一份。"
          } > README.md
          git add -f "./${APK_NAME}" README.md
          git commit -q -m "release: ${APK_NAME} (run #${{ github.run_number }})"
          git push -q -f origin release
          echo "published ${APK_NAME} to release branch"

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
