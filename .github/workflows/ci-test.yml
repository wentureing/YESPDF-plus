name: CI Test

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dfile.encoding=UTF-8'

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 缓存与 ci-build.yml 使用完全相同的 key，两条流水线互通
      - name: Restore Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      # 先装 JDK 17：runner 自带的 cmdline-tools/sdkmanager 要求 JDK 17+
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # 关键：不把 runner 预装的几十个新版 SDK 包暴露给 AGP 3.4.1，
          # 否则它用自带的旧 com.android.repository 解析新元数据会喷上万行
          # "cvc-complex-type.2.4.a ... base-extension" + XML 栈，纯噪声且拖慢构建。
          MINI_SDK="$HOME/android-sdk-mini"
          rm -rf "$MINI_SDK"; mkdir -p "$MINI_SDK"
          "$SDKMANAGER" --sdk_root="$MINI_SDK" --install \
            "platforms;android-29" "build-tools;28.0.3" "platform-tools" > /dev/null
          # 许可协议必须落在新 sdk_root 下，否则 AGP 会报 license not accepted
          cp -a "$ANDROID_SDK_ROOT/licenses" "$MINI_SDK/licenses" 2>/dev/null || true
          cp -a "$ANDROID_SDK_ROOT/tools" "$MINI_SDK/tools" 2>/dev/null || true
          {
            echo "ANDROID_SDK_ROOT=$MINI_SDK"
            echo "ANDROID_HOME=$MINI_SDK"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$MINI_SDK" > local.properties
          ls "$MINI_SDK"

      # 再切回 JDK 8：Gradle 5.4.1 + AGP 3.4.1 只能跑在 JDK 8
      - name: Set up JDK 8 (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # 架构静态检查：依赖方向 / 文件与目录数量 / 块注释安全
      # （零依赖，Ubuntu runner 自带 python3）
      - name: Architecture & size check
        run: python3 .github/scripts/arch_check.py

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace \
            -PBUILD_NUMBER=$((32 + GITHUB_RUN_NUMBER)) \
            -PVERSION_NAME=2.3.${GITHUB_RUN_NUMBER}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-r${{ github.run_number }}
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
