apply plugin: 'com.android.library'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-android'

// 该模块以源码形式内嵌（YESPDF 的上游 fork），不再发布到 bintray/jcenter，
// 因此原先的 bintray.gradle（依赖已停服的插件 + local.properties）整体移除。

android {
    compileSdkVersion 29

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 29
        versionCode 1
        versionName "3.2.0-beta.1"
    }

}

dependencies {
    implementation 'com.android.support:support-compat:28.0.0'
    // PDFium JNI 绑定（shockwave 版，2018 年后停更）。
    // M2 里程碑将评估升级到 io.legere:pdfiumandroid（提供 closePage）。
    api 'com.github.barteksc:pdfium-android:1.9.0'
    implementation 'com.aaron:base:1.1.5-beta9'
    implementation 'androidx.core:core-ktx:1.3.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

repositories {
    mavenCentral()
}
